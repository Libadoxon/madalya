[package]
name = "madalya"
version = "0.1.0"
edition = "2024"
description = "Simple clips viewer for the people"

[dependencies]
anyhow = "1.0.102"
dirs = "6.0.0"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", version = "0.5.1" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", version = "0.5.1" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
  "wayland",
] }
jiff = "0.2.24"
notify = "8.2.0"
rust-embed = "8"
serde = { version = "1.0.228", features = ["derive"] }
smol = "2.0.2"
strum = { version = "0.28.0", features = ["derive"] }
toml = "1.1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
