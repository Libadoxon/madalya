[package]
name = "madalya"
version = "0.1.0"
edition = "2024"
description = "Simple clips viewer for the people"

[dependencies]
anyhow = "1.0.102"
dirs = "6.0.0"
gpui-kit = { version = "0.6", features = ["tree-sitter-rust"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-audio = "0.25"
gstreamer-pbutils = "0.25"
gstreamer-video = "0.25"
jiff = "0.2.24"
notify = "8.2.0"
rhai = { version = "1", features = ["sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
smol = "2.0.2"
strum = { version = "0.28.0", features = ["derive"] }
toml = "1.1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "2"
# Match gpui's image version so `image::Frame` unifies with `RenderImage`.
image = "0.25"
smallvec = "1"
walkdir = "2"
